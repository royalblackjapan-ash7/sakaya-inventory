<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12334a"><meta name="apple-mobile-web-app-capable" content="yes"><title>酒屋棚卸し</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f3f6f8;color:#152c3d}*{box-sizing:border-box}body{margin:0}header{background:#12334a;color:#fff;padding:18px 16px}header strong{font-size:21px}header small{display:block;color:#d1e0e9;margin-top:5px}main{max-width:720px;margin:auto;padding:12px 12px 85px}.card{background:white;border:1px solid #dae4ea;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 7px #12334a0a}.hidden{display:none!important}h2{font-size:18px;margin:0 0 13px}label{font-size:14px;font-weight:700;display:block;margin:12px 0 5px}input{width:100%;border:1px solid #b8c9d4;border-radius:10px;font-size:19px;padding:13px;background:white}button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;color:#173448;background:#e9f0f4;cursor:pointer}button.primary{background:#16739d;color:white}button.danger{background:#ae4545;color:white}button:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:105px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}nav button{padding:12px 4px;font-size:14px}nav .active{background:#12334a;color:white}.muted{font-size:13px;color:#647786}.entry{border-bottom:1px solid #e4ebf0;padding:12px 0}.entry:last-child{border:0}.entry strong{display:block}.entry small{display:block;color:#647786;margin-top:4px}.stat{display:flex;justify-content:space-between;background:#eaf3f8;padding:12px;border-radius:9px;margin:8px 0}.notice{background:#fff5df;padding:12px;border-radius:9px;font-size:13px}.ok{color:#177447}.error{color:#ae4545}video{width:100%;max-height:270px;object-fit:cover;border-radius:12px;background:black}#toast{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);background:#12334a;color:white;border-radius:12px;padding:13px 18px;display:none;max-width:94%;font-size:14px}#sync{font-size:12px;float:right;color:#d5e5ec}.count{font-size:32px;font-weight:800}.inline{display:flex;gap:8px;align-items:center}.inline input{flex:1;min-width:0}.small{font-size:12px}input[type=number]{font-variant-numeric:tabular-nums}
</style></head><body><header><strong>酒屋 棚卸し</strong><span id="sync">未接続</span><small>バーコードでマスタ登録・本数集計</small></header><main>
<section id="login" class="card"><h2>ログイン</h2><p class="muted">登録済みの2人専用です。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="primary" id="signIn">ログイン</button></div><p id="authMsg" class="muted"></p></section>
<section id="app" class="hidden"><nav><button data-tab="scan" class="active">読み取り</button><button data-tab="list">棚卸し一覧</button><button data-tab="master">商品マスタ</button></nav>
<section id="scan"><div class="card"><h2>作業モード</h2><div class="actions"><button id="stockMode" class="primary">棚卸し</button><button id="masterMode">マスタ登録</button></div><p id="modeHint" class="muted">棚卸し：読み取り後に本数を入力します。</p></div><div class="card"><h2>バーコードを読み取る</h2><video id="video" class="hidden" playsinline muted></video><div id="fallbackScanner" class="hidden"></div><div class="actions"><button id="camera" class="primary">📷 カメラ起動</button><button id="stopCamera">停止</button></div><p id="cameraMsg" class="muted"></p><label>JANコード（手入力も可）</label><div class="inline"><input id="jan" inputmode="numeric" placeholder="8桁または13桁"><button id="lookup">検索</button></div></div>
<div class="card hidden" id="productPanel"><h2 id="panelTitle">商品確認</h2><p id="lookupMsg" class="muted"></p><label>商品名</label><input id="productName" autocomplete="off"><label>容量・規格（例：350ml、720ml、1.8L）</label><input id="capacity" autocomplete="off" placeholder="容量を入力・確認"><div id="qtyBox"><label>今回数えた本数</label><input id="qty" type="number" inputmode="numeric" min="0" step="1" placeholder="本数"><p id="previous" class="muted"></p></div><div class="actions"><button id="save" class="primary">登録して次へ</button><button id="cancel">キャンセル</button></div></div></section>
<section id="list" class="hidden"><div class="card"><h2>棚卸し一覧</h2><label>棚卸し日</label><input type="date" id="sessionDate"><div class="stat"><span>商品種類</span><strong id="types">0</strong></div><div class="stat"><span>合計本数</span><strong id="total">0</strong></div><div class="actions"><button id="exportStock" class="primary">CSV出力</button><button id="undo">直前の登録を取り消す</button></div><div id="stockList"></div><div class="actions"><button id="newSession">新しい棚卸しを開始</button></div><p class="muted">新しい棚卸しを開始しても過去の履歴と商品マスタは残ります。</p></div><div class="card"><h2>棚卸し履歴</h2><div id="sessionList"></div></div></section>
<section id="master" class="hidden"><div class="card"><h2>商品マスタ</h2><div class="actions"><button id="exportMaster" class="primary">CSV出力</button><button id="importMaster">CSV取込</button><input id="masterFile" type="file" accept=".csv,text/csv" class="hidden"></div><p class="muted">CSV形式：JANコード,商品名,容量・規格（旧2列形式も取込可）</p><div id="masterList"></div></div></section>
<div class="card"><p id="cloudMsg" class="muted">クラウド接続を確認しています。</p><div class="actions"><button id="refresh">クラウドから再読み込み</button><button id="signOut">ログアウト</button></div></div></section></main><div id="toast" role="status"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://gtglyfypswmfnneqlfez.supabase.co';
const KEY='sb_publishable_gcrnjySv6xGBxImtxKKLYA_jnoh1aAg';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),date=()=>new Date().toLocaleDateString('sv-SE');
let user=null,mode='stock',active='',lookupId=0,stream=null,detector=null,fallback=null,scanning=false,busy=false,session=null,products=new Map(),counts=new Map(),sessions=[],lastEvent=null,refreshing=false,productIds=new Map(),capacities=new Map();
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function valid(j){return /^(\d{8}|\d{13})$/.test(j)}
function status(s,err=false){$('sync').textContent=s;$('sync').style.color=err?'#ffbdbd':'#d5e5ec';$('cloudMsg').textContent=s}
function check(res){if(res.error)throw res.error;return res.data}
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));for(const n of ['scan','list','master'])$(n).classList.toggle('hidden',n!==t);render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function setMode(m){mode=m;cancel();$('stockMode').classList.toggle('primary',m==='stock');$('masterMode').classList.toggle('primary',m==='master');$('qtyBox').classList.toggle('hidden',m==='master');$('save').textContent=m==='master'?'マスタ登録して次へ':'登録して次へ';$('modeHint').textContent=m==='master'?'マスタ登録：本数は記録せず、商品名と容量を登録します。':'棚卸し：読み取り後に本数を入力します。'}
$('stockMode').onclick=()=>setMode('stock');$('masterMode').onclick=()=>setMode('master');
function render(){if(!user)return;const arr=[...counts.entries()];$('types').textContent=arr.length;$('total').textContent=arr.reduce((a,[,v])=>a+v,0);$('sessionDate').value=session?.inventory_date||date();$('stockList').innerHTML=arr.length?arr.map(([j,q])=>`<div class="entry"><strong>${safe(products.get(j)||'商品名未登録')}${capacities.get(j)?` ／ ${safe(capacities.get(j))}`:''}</strong><small>${safe(j)} ／ ${q}本</small><div class="actions"><button data-edit="${j}">本数修正</button><button data-delete="${j}">削除</button></div></div>`).join(''):'<p class="muted">まだ登録がありません。</p>';$('masterList').innerHTML=products.size?[...products].sort((a,b)=>a[0].localeCompare(b[0])).map(([j,n])=>`<div class="entry"><strong>${safe(n)}</strong><small>${safe(j)}${capacities.get(j)?` ／ ${safe(capacities.get(j))}`:''}</small><div class="actions"><button data-medit="${j}">商品名修正</button><button data-mdelete="${j}">削除</button></div></div>`).join(''):'<p class="muted">商品マスタは空です。</p>';$('sessionList').innerHTML=sessions.map(s=>`<div class="entry"><strong>${safe(s.inventory_date)} ${s.id===session?.id?'（作業中）':''}</strong><small>${s.status==='completed'?'保存済み':'進行中'}</small><div class="actions"><button data-open="${s.id}">開く</button><button data-export="${s.id}">CSV出力</button></div></div>`).join('')}
async function load(){if(!user||refreshing)return;refreshing=true;status('同期中…');try{const [p,s]=await Promise.all([db.from('products').select('id,barcode,product_name,capacity').order('barcode'),db.from('inventory_sessions').select('*').order('created_at',{ascending:false})]);const pr=check(p);products=new Map(pr.map(x=>[x.barcode,x.product_name]));productIds=new Map(pr.map(x=>[x.barcode,x.id]));capacities=new Map(pr.map(x=>[x.barcode,x.capacity||'']));sessions=check(s);const current=session&&sessions.find(x=>x.id===session.id);session=current||sessions.find(x=>x.status==='in_progress')||sessions[0]||null;if(!session){session=check(await db.from('inventory_sessions').insert({inventory_date:date(),status:'in_progress',user_id:user.id}).select().single());sessions.unshift(session)}const data=check(await db.from('inventory_items').select('product_id,quantity').eq('session_id',session.id));const ids=new Map([...productIds].map(([code,id])=>[id,code]));counts=new Map(data.filter(x=>ids.has(x.product_id)).map(x=>[ids.get(x.product_id),x.quantity]));render();status('クラウド同期済み')}catch(e){status('同期失敗：'+e.message,true)}finally{refreshing=false}}
async function loginUI(){const {data:{session:s}}=await db.auth.getSession();user=s?.user||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user)await load()}
$('signIn').onclick=async()=>{const b=$('signIn');b.disabled=true;$('authMsg').textContent='ログイン中…';try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});check(r);$('password').value='';$('authMsg').textContent='';await loginUI()}catch(e){$('authMsg').textContent='ログイン失敗：'+e.message}finally{b.disabled=false}};
$('signOut').onclick=async()=>{stopCamera();await db.auth.signOut();user=null;session=null;products.clear();capacities.clear();counts.clear();await loginUI()};$('refresh').onclick=load;
function cancel(){lookupId++;active='';$('productPanel').classList.add('hidden');$('jan').value='';$('productName').value='';$('capacity').value='';$('qty').value='';$('lookupMsg').textContent=''}$('cancel').onclick=cancel;
async function lookup(j){j=String(j).trim();if(!valid(j))return toast('JANコードは8桁または13桁です');stopCamera();active=j;$('jan').value=j;$('productPanel').classList.remove('hidden');$('qty').value='';$('previous').textContent=counts.has(j)?`現在 ${counts.get(j)}本（入力分を加算）`:'初回登録';$('panelTitle').textContent=products.has(j)?'登録済み商品':'新しい商品';if(products.has(j)){$('productName').value=products.get(j);$('capacity').value=capacities.get(j)||'';$('lookupMsg').textContent='共通マスタから取得しました';(mode==='master'?$('productName'):$('qty')).focus();return}const seq=++lookupId;$('productName').value='';$('capacity').value='';$('lookupMsg').textContent='外部の商品情報を検索中…';try{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),5500);let r;try{r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(j)}.json?fields=product_name,product_name_ja,quantity,product_quantity,product_quantity_unit`,{signal:ctl.signal})}finally{clearTimeout(timer)}const d=await r.json();if(seq!==lookupId)return;const name=(d.product?.product_name_ja||d.product?.product_name||'').trim();const rawQty=String(d.product?.quantity||'').trim();const numberQty=d.product?.product_quantity;const unitQty=String(d.product?.product_quantity_unit||'').trim();const capacity=rawQty||(numberQty!=null&&unitQty?`${numberQty} ${unitQty}`:'');$('productName').value=name;$('capacity').value=capacity;$('lookupMsg').textContent=name?'候補が見つかりました。商品名と容量を確認して登録してください。':'候補がありません。商品名を入力してください。'}catch(e){if(seq!==lookupId)return;$('lookupMsg').textContent='外部検索できませんでした。商品名を入力してください。'}$('productName').focus()}
$('lookup').onclick=()=>lookup($('jan').value);$('jan').onkeydown=e=>{if(e.key==='Enter')lookup($('jan').value)};
async function saveProduct(j,n,c=''){let id=productIds.get(j);if(id){check(await db.from('products').update({product_name:n,capacity:c}).eq('id',id))}else{const existing=check(await db.from('products').select('id').eq('barcode',j).maybeSingle());if(existing){id=existing.id;check(await db.from('products').update({product_name:n,capacity:c}).eq('id',id))}else{const result=check(await db.from('products').insert({barcode:j,product_name:n,capacity:c,user_id:user.id}).select('id').single());id=result.id}}productIds.set(j,id);products.set(j,n);capacities.set(j,c);return id}
async function setQuantity(j,q){const id=productIds.get(j);if(!id)throw Error('商品IDが見つかりません');check(await db.from('inventory_items').upsert({session_id:session.id,product_id:id,quantity:q,user_id:user.id},{onConflict:'session_id,product_id'}))}
$('save').onclick=async()=>{if(busy)return;const j=active,n=$('productName').value.trim(),c=$('capacity').value.trim(),qstr=$('qty').value.trim(),q=Number(qstr);if(!valid(j)||!n)return toast('JANコードと商品名を確認してください');if(mode==='stock'&&(!/^\d+$/.test(qstr)||!Number.isSafeInteger(q)))return toast('本数は0以上の整数で入力してください');busy=true;$('save').disabled=true;status('保存中…');try{await saveProduct(j,n,c);if(mode==='stock'){const previous=counts.get(j)||0;await setQuantity(j,previous+q);lastEvent={session_id:session.id,barcode:j,previous};counts.set(j,previous+q)}render();cancel();status('クラウド保存済み');toast(mode==='master'?'マスタ登録しました':'登録しました。次の商品へ');$('jan').focus()}catch(e){status('保存失敗：'+e.message,true);toast('保存できませんでした：'+e.message)}finally{busy=false;$('save').disabled=false}};
$('undo').onclick=async()=>{if(!lastEvent)return toast('この端末で直前に登録した操作がありません');if(!confirm('直前の本数追加を取り消しますか？'))return;try{const e=lastEvent;const id=productIds.get(e.barcode);check(await db.from('inventory_items').update({quantity:e.previous}).eq('session_id',e.session_id).eq('product_id',id));lastEvent=null;await load();toast('取り消しました')}catch(e){toast('取り消し失敗：'+e.message)}};
$('stockList').onclick=async e=>{const a=e.target.dataset,j=a.edit||a.delete;if(!j)return;try{if(a.edit){const q=prompt('合計本数に修正',counts.get(j));if(q===null)return;if(!/^\d+$/.test(q)||!Number.isSafeInteger(Number(q)))return toast('0以上の整数で入力');await setQuantity(j,Number(q))}else{if(!confirm('この商品の棚卸し記録を削除しますか？'))return;check(await db.from('inventory_items').delete().eq('session_id',session.id).eq('product_id',productIds.get(j)))}lastEvent=null;await load()}catch(e){toast(e.message)}};
$('masterList').onclick=async e=>{const a=e.target.dataset,j=a.medit||a.mdelete;if(!j)return;try{if(a.medit){const n=prompt('商品名を修正',products.get(j));if(n===null)return;if(!n.trim())return toast('商品名が空です');await saveProduct(j,n.trim(),capacities.get(j)||'')}else{if(!confirm('商品マスタから削除しますか？ 棚卸しで使用済みの商品は削除できません。'))return;check(await db.from('products').delete().eq('barcode',j))}await load()}catch(e){toast('変更失敗：'+e.message)}};
$('newSession').onclick=async()=>{if(!confirm('現在の棚卸しを終了し、新しい棚卸しを開始しますか？'))return;try{check(await db.from('inventory_sessions').update({status:'completed'}).eq('id',session.id));session=check(await db.from('inventory_sessions').insert({inventory_date:date(),status:'in_progress',user_id:user.id}).select().single());lastEvent=null;await load();tab('scan');toast('新しい棚卸しを開始しました')}catch(e){toast(e.message)}};
$('sessionDate').onchange=async e=>{if(!session)return;try{check(await db.from('inventory_sessions').update({inventory_date:e.target.value}).eq('id',session.id));await load()}catch(err){toast(err.message)}};
function csv(rows,name){const text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=window.URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>window.URL.revokeObjectURL(url),5000)}
function stockCsv(data,day){csv([['JANコード','商品名','容量・規格','在庫本数'],...data.map(x=>[x.barcode,products.get(x.barcode)||'',capacities.get(x.barcode)||'',x.qty])],`棚卸し_${day}.csv`)}
$('exportStock').onclick=()=>stockCsv([...counts].map(([barcode,qty])=>({barcode,qty})),session?.inventory_date||date());$('exportMaster').onclick=()=>csv([['JANコード','商品名','容量・規格'],...[...products].map(([j,n])=>[j,n,capacities.get(j)||''])],'商品マスタ.csv');
$('sessionList').onclick=async e=>{const id=e.target.dataset.open||e.target.dataset.export;if(!id)return;const s=sessions.find(x=>x.id===id);if(!s)return;try{if(e.target.dataset.open){session=s;lastEvent=null;await load();tab('list')}else{const rows=check(await db.from('inventory_items').select('product_id,quantity').eq('session_id',id));stockCsv(rows.map(x=>({barcode:[...productIds].find(([,pid])=>pid===x.product_id)?.[0]||'',qty:x.quantity})),s.inventory_date)}}catch(err){toast(err.message)}};
$('importMaster').onclick=()=>$('masterFile').click();function parseCSV(s){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(Boolean))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(Boolean))rows.push(row);return rows}
$('masterFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=parseCSV((await f.text()).replace(/^\ufeff/,''));const map=new Map();for(const r of rows){const j=(r[0]||'').trim(),n=(r[1]||'').trim();if(valid(j)&&n)map.set(j,{name:n,capacity:(r[2]||'').trim()})}if(!map.size)return toast('有効な商品がありません');if(!confirm(`${map.size}件を共通マスタに登録しますか？`))return;for(const [barcode,item] of map)await saveProduct(barcode,item.name,item.capacity||capacities.get(barcode)||'');await load();toast(`${map.size}件登録しました`)}catch(err){toast('CSV取込失敗：'+err.message)}finally{e.target.value=''}};
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia)return $('cameraMsg').textContent='HTTPS接続が必要です';if(!('BarcodeDetector'in window)){try{if(!window.Html5Qrcode)throw Error('読み取りライブラリを取得できません');fallback=new Html5Qrcode('fallbackScanner');$('fallbackScanner').classList.remove('hidden');scanning=true;await fallback.start({facingMode:'environment'},{fps:12,qrbox:{width:260,height:150}},code=>{if(valid(code)){stopCamera();lookup(code)}},()=>{});$('cameraMsg').textContent='バーコードを中央に映してください'}catch(e){stopCamera();$('cameraMsg').textContent='カメラ起動失敗：'+e.message}return}try{detector=new BarcodeDetector({formats:['ean_13','ean_8']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;$('video').classList.remove('hidden');await $('video').play();scanning=true;$('cameraMsg').textContent='バーコードを中央に映してください';scanLoop()}catch(e){stopCamera();$('cameraMsg').textContent='カメラ起動失敗。Safariのカメラ権限をご確認ください。'}}
async function scanLoop(){if(!scanning)return;try{const found=await detector.detect($('video'));const code=found.find(x=>valid(x.rawValue));if(code){stopCamera();lookup(code.rawValue);return}}catch{}if(scanning)setTimeout(scanLoop,130)}
function stopCamera(){scanning=false;if(fallback){const old=fallback;fallback=null;old.stop().then(()=>old.clear()).catch(()=>{});$('fallbackScanner').classList.add('hidden')}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('video').classList.add('hidden')}$('camera').onclick=startCamera;$('stopCamera').onclick=stopCamera;window.addEventListener('pagehide',stopCamera);
setMode('stock');loginUI().catch(e=>$('authMsg').textContent=e.message);
</script></body></html>
